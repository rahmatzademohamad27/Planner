<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeLedger Planner</title>
<meta name="theme-color" content="#0a1416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LifeLedger">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230a1416%27/%3E%3Cg transform=%27rotate(-40 16 16)%27%3E%3Crect x=%274%27 y=%2710%27 width=%2724%27 height=%2712%27 rx=%276%27 fill=%27none%27 stroke=%27%2322d3a0%27 stroke-width=%272%27/%3E%3Cpath d=%27M16 10h6a6 6 0 0 1 0 12h-6z%27 fill=%27%2322d3a0%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1416;--surface:#102022;--surface2:#16292c;--line:#22393d;
  --text:#e5f0ee;--muted:#8aa5a3;--accent:#22d3a0;--accent-ink:#04231b;
  --up:#22d3a0;--down:#ff6b7a;--warn:#f5b84a;--info:#5aa9ff;
  --ui:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme=light]{
  --bg:#edf4f3;--surface:#ffffff;--surface2:#f2f7f6;--line:#d3e2df;
  --text:#0c2225;--muted:#58767a;--accent:#0a9b76;--accent-ink:#ffffff;
  --up:#0a9b76;--down:#d6404f;--warn:#b7791f;--info:#2b6fd6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:17px}h3{font-size:15px}
p{margin:0}
.num,.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:13px}

/* ticker */
.ticker{position:sticky;top:0;z-index:20;height:38px;background:#061012;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
[data-theme=light] .ticker{background:#0c2225}
.track{display:inline-flex;height:100%;align-items:center;animation:tk 70s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.tk{display:inline-flex;gap:8px;align-items:center;padding:0 22px;border-inline-end:1px solid #1d3438;font-family:var(--num);font-size:12.5px;color:#bcd3d0;text-transform:uppercase;letter-spacing:.02em}
.tk b{font-weight:600;color:#eaf6f4}
.tk em{font-style:normal;color:#eaf6f4}
.tk .up{color:#2ee6ad}.tk .dn{color:#ff7b89}.tk .fl{color:#7f9c99}
.tk.evt{color:#f5b84a}
@keyframes tk{to{transform:translateX(-25%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.ticker{overflow-x:auto}}

/* layout */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 38px)}
.side{border-inline-end:1px solid var(--line);padding:18px 14px;position:sticky;top:38px;align-self:start;height:calc(100vh - 38px);overflow:auto;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:4px}
.clock{font-size:12.5px;color:var(--muted);margin:2px 0 18px 0;padding-inline-start:40px;line-height:1.35}
.side nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-inline-start:3px solid transparent;border-radius:0 8px 8px 0;text-align:start;padding:9px 12px;color:var(--muted);font-weight:500}
.nv:hover{background:var(--surface2);color:var(--text)}
.nv.on{border-inline-start-color:var(--accent);background:var(--surface2);color:var(--text)}
.badge{font-family:var(--num);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.nv.on .badge{background:var(--bg)}
.badge.hot{background:var(--down);border-color:var(--down);color:#fff}
.nv-sep{height:1px;background:var(--line);margin:10px 8px}
main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* components */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger:hover{border-color:var(--down);color:var(--down)}
.btn.sm{padding:3px 9px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;color:var(--muted)}
button.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}

/* capsule progress */
.cap{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.cap>i{display:block;height:100%;border-radius:99px;background-color:var(--c,var(--accent));background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.2) 0 6px,transparent 6px 12px);transition:width .45s ease;box-shadow:inset 0 -3px 4px rgba(0,0,0,.15)}
.cap.lg{height:18px}
.cap.thin{height:8px}
.cap.time>i{background-image:none;opacity:.55}
.pct{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:16px}
.donut{position:relative;width:170px;height:170px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-family:var(--num);font-size:34px;font-weight:600}
.donut .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{border-inline-start:2px solid var(--line);padding-inline-start:14px}
.stat b{display:block;font-family:var(--num);font-size:24px;font-weight:600}
.stat span{color:var(--muted);font-size:13px}
@media(max-width:620px){.hero{grid-template-columns:1fr;justify-items:center}}

/* area rows */
.arow{display:block;width:100%;text-align:start;background:none;border:0;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border:0}
.arow:hover .nm{color:var(--accent)}
.arow .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
.arow .nm{font-weight:600}

/* lists */
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .grow{flex:1;min-width:0}
.kind{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.k-exam{color:var(--down)}.k-deadline{color:var(--warn)}.k-appointment{color:var(--info)}.k-special{color:var(--accent)}
.cd{font-family:var(--num);font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.cd.r{color:var(--down);border-color:var(--down)}
.cd.a{color:var(--warn);border-color:var(--warn)}

/* tasks */
.task{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:6px;cursor:pointer}
.task:hover{background:var(--surface2)}
.task input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;border-radius:6px}
.x:hover{color:var(--down)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input[type=text]{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
select.mini{width:auto;max-width:110px;padding:6px}
input.numi{width:90px;font-family:var(--num);padding:4px 8px}
input[type=range]{accent-color:var(--accent);width:100%}

/* nav bars */
.navbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.navbar h2{min-width:190px;text-align:center}

/* week */
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:160px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h3{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.day .addrow input{font-size:13px;padding:5px 8px}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}
.cell{min-height:98px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell:hover{border-color:var(--accent)}
.cell.off{opacity:.45}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell .dn{font-family:var(--num);font-size:12.5px;color:var(--muted)}
.cell.today .dn{color:var(--accent);font-weight:700}
.cell .ln{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline-start:6px;border-inline-start:2px solid var(--muted)}
.cell .ln.d{text-decoration:line-through;color:var(--muted)}
.cell .ev{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .more{font-size:11px;color:var(--muted)}
@media(max-width:700px){.cell{min-height:64px;padding:4px}.cell .ln{display:none}.cell .ev{font-size:0;height:6px;padding:0;border-radius:3px;background:currentColor}}

/* year */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.mcard:hover{border-color:var(--accent)}
.mcard.now{border-color:var(--accent)}

/* goals */
.area{margin-bottom:22px}
.area-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.area-h .grow{flex:1;min-width:200px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:10px}
.goal .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal .hd h3{overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta .hl{color:var(--text)}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chk .task{padding:3px 4px;font-size:14px}
.done-badge{color:var(--up);font-weight:600}

/* projects */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.status{font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid currentColor}
.s-track{color:var(--up)}.s-ahead{color:var(--info)}.s-behind{color:var(--warn)}.s-over{color:var(--down)}.s-done{color:var(--up);background:color-mix(in srgb,var(--up) 15%,transparent)}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--num);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* dialog */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(2,10,12,.65)}
dialog h3{margin-bottom:14px;font-size:18px}
.fr{margin-bottom:12px}
.fr label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fr.cb label{display:flex;align-items:center;gap:8px;color:var(--text)}
.fr.cb input{width:auto;accent-color:var(--accent)}
.fr[hidden]{display:none}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 16px;border:1px solid var(--warn);border-radius:10px;color:var(--warn);margin-bottom:16px;font-size:14px}

/* extras */
.tl{position:relative;margin-top:10px}
.tl-h{position:absolute;inset-inline:0;border-top:1px solid var(--line)}
.tl-h span{position:absolute;inset-inline-start:0;top:-8px;background:var(--surface);padding-inline-end:6px;font:11px 'IBM Plex Mono',monospace;color:var(--muted)}
.tl-b,.tl-s{position:absolute;inset-inline-start:58px;border-radius:8px;padding:3px 8px;overflow:hidden;text-align:start;color:var(--text);font-size:12.5px;line-height:1.25;display:flex;flex-direction:column;border:0}
.tl-b{background:color-mix(in srgb,var(--c) 30%,var(--surface2));border-inline-start:3px solid var(--c);cursor:pointer}
.tl-b span{color:var(--muted);font-size:11px}
.tl-b.ov{outline:2px solid var(--down)}
.tl-s{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,transparent 6px,transparent 12px);border:1px dashed var(--line);color:var(--muted)}
.tl-now{position:absolute;inset-inline:0;border-top:2px solid var(--accent);z-index:2}
.tl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tl-stats b{display:block;font-size:22px;font-family:'IBM Plex Mono',monospace}
.tl-stats span{color:var(--muted);font-size:12px}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px;margin-bottom:14px}
.wkc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;background:none;border:0;color:var(--muted);font-size:11px;padding:0;min-width:0}
.wkc i{display:block;width:70%;border-radius:5px 5px 0 0;background:var(--info);min-height:2px}
.wkc.sel i{background:var(--accent)}
.wkc.sel{color:var(--text)}
.tlbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.tlbar i{display:block;height:100%}
.task.met{opacity:.6}
.spark{width:100%;height:56px;display:block;margin:4px 0}
.trow{border-radius:8px}
.trow.dragging,.ln.dragging{opacity:.35}
.trow.drop-above{box-shadow:0 -2px 0 var(--accent)}
.trow.drop-below{box-shadow:0 2px 0 var(--accent)}
.ln.drop-above{box-shadow:0 -2px 0 var(--accent)}
.ln.drop-below{box-shadow:0 2px 0 var(--accent)}
.drop-over{outline:2px dashed var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.trow[draggable=true] .task{cursor:grab}
.pri{width:12px;height:22px;background:none;border:0;padding:0;position:relative;flex:none}
.pri::after{content:"";position:absolute;inset:0 4px;border-radius:3px;border:1px dashed var(--muted)}
.pri.p-low::after{background:var(--info);border:0}
.pri.p-med::after{background:var(--warn);border:0}
.pri.p-high::after{background:var(--down);border:0}
.subbtn{background:none;border:0;color:var(--muted);padding:2px 5px;border-radius:6px;line-height:0}
.subbtn:hover{color:var(--text);background:var(--bg)}
.subbtn svg{transition:transform .15s}
.trow.open .subbtn svg{transform:rotate(180deg)}
.tdetail{margin:2px 0 10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.tdetail .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tdetail input[type=date]{width:auto}
.tdetail select{width:auto}
.lk.mu{color:var(--muted)}
.cell{cursor:pointer}
.week{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.day .task{gap:6px;padding:5px 2px}
.day .task .dot{width:7px;height:7px}
.day .task .t{min-width:40px}
.day .pri{width:10px}
.day .addrow{flex-wrap:wrap}
.day .addrow input[type=text]{flex:1 1 100%}
.day .addrow select.mini{flex:1;max-width:none}
@media (hover:hover){
  .day .task{position:relative}
  .day .task .subbtn,.day .task .x{position:absolute;top:3px;opacity:0;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 4px;line-height:1}
  .day .task .x{inset-inline-end:2px}
  .day .task .subbtn{inset-inline-end:26px}
  .day .task:hover .subbtn,.day .task:hover .x,.day .task:focus-within .subbtn,.day .task:focus-within .x{opacity:1}
}
.day .subbtn{padding:2px 3px}
.day .x{padding:0 3px}
.task .t{overflow-wrap:anywhere}
.ticker{direction:ltr}
.chart{direction:ltr}
[dir=rtl]{--ui:'Vazirmatn',Tahoma,'Segoe UI',ui-sans-serif,sans-serif;--num:'Vazirmatn',Tahoma,ui-monospace,monospace}
[dir=rtl] .nv{border-radius:8px 0 0 8px}
[dir=rtl] body{letter-spacing:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;gap:14px;align-items:center;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px;max-width:92vw}
.toast[hidden]{display:none}
.toast .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.rp{color:var(--muted);font-size:13px;margin-inline-end:2px}

.lk{display:block;font-size:12px;color:var(--accent);margin-top:1px}
.linkrow{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{margin-bottom:16px}
.heat{display:flex;flex-wrap:wrap;gap:4px}
.sq{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);background:var(--bg);padding:0}
.sq.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.sq.off{opacity:.35;border-style:dashed}
.sq.now{outline:2px solid var(--text);outline-offset:1px}
.ring{position:relative;width:230px;height:230px;margin:0 auto 16px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--num);font-size:46px;font-weight:600}
.ring .c span{color:var(--muted);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border:0}
.tw{overflow-x:auto}
.up{color:var(--up)}.dn{color:var(--down)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}
.fr .chip{display:inline-flex;margin:0;color:var(--text);font-size:13px}
select.st{width:auto;padding:4px 8px}
.addrow.wrap{flex-wrap:wrap}
.due{border-color:var(--down);color:var(--down)}
/* mobile nav */
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:12px}
  .clock{display:none}
  .side nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nv{border-inline-start:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;white-space:nowrap;gap:8px}
  .nv.on{border-bottom-color:var(--accent)}
  .nv-sep{display:none}
  .toast{bottom:14px}
  main{padding-top:18px}
}

function remaining(g){
  if(g.type==='level'){return goalPct(g)>=100?'Completed':`${fmtN(Math.abs((g.target||0)-(g.current||0)))} ${g.unit||''} to go`.replace('  ',' ')}
  if(g.type==='count'){const r=Math.max(0,g.target-g.current);return r===0?'Completed':`${fmtN(r)} ${g.unit||''} to go`.replace('  ',' ')}
  if(g.type==='checklist'){const n=g.items.filter(i=>!i.done).length;return n===0&&g.items.length?'Completed':`${n} step${n===1?'':'s'} to go`}
  const r=100-clamp(g.pct||0,0,100);return r===0?'Completed':`${fmtN(r)}% to go`}
function pace(g){
  if(g.type==='count'&&g.period){const r=g.target-g.current;if(r<=0)return'';const b=periodRange(g.period,today())[1];const days=Math.max(1,diffD(today(),b)+1);return`Pace needed: ${fmtN(r/days)} ${g.unit||''} per day`.replace('  ',' ')}
  if(!g.deadline||goalPct(g)>=100)return'';
  if(g.type==='level'){const dl=diffD(today(),g.deadline);if(dl<0)return`Overdue by ${-dl} day${dl===-1?'':'s'}`;const wk=Math.max(dl,1)/7;return`Pace needed: ${fmtN(Math.abs((g.target||0)-(g.current||0))/wk)} ${g.unit||''} per week`.replace('  ',' ')}
  const dl=diffD(today(),g.deadline);
  if(dl<0)return`Overdue by ${-dl} day${dl===-1?'':'s'}`;
  const wk=Math.max(dl,1)/7;
  if(g.type==='count'){const r=g.target-g.current;return`Pace needed: ${fmtN(r/wk)} ${g.unit||''} per week`.replace('  ',' ')}
  if(g.type==='checklist'){const n=g.items.filter(i=>!i.done).length;return`Pace needed: ${fmtN(n/wk)} step${n/wk===1?'':'s'} per week`}
  return`Pace needed: ${fmtN((100-g.pct)/wk)}% per week`}
function snapshot(){refreshPeriods();const h={all:+overall().toFixed(2)};S.areas.forEach(a=>h[a.id]=+areaPct(a.id).toFixed(2));S.history[today()]=h}
function prevSnap(){const k=Object.keys(S.history).filter(k=>k<today()).sort().pop();return k?S.history[k]:null}

/* ---------- reminders (manual + automatic) ---------- */
function nextOcc(e){if(!e.yearly)return e.date;const t=today();const c=toCal(e.date),n=toCal(t);const at=y=>fromCal(y,c.m,Math.min(c.d,monthLen(y,c.m)));let d=at(n.y);if(d<t)d=at(n.y+1);return d}
function allReminders(){
  const out=S.events.map(e=>({id:e.id,title:e.title,date:nextOcc(e),kind:e.kind,src:'event',yearly:e.yearly}));
  S.goals.forEach(g=>{if(g.deadline&&goalPct(g)<100)out.push({id:g.id,title:`Goal: ${g.title}`,date:g.deadline,kind:'deadline',src:'goal'})});
  S.projects.forEach(p=>{const end=addD(p.start,p.days);if(projPct(p)<100)out.push({id:p.id,title:`Project: ${p.title}`,date:end,kind:'deadline',src:'project'})});
  S.countries.forEach(c=>{if(c.target&&docPct(c)<100&&c.status!=='Approved'&&c.status!=='Dropped')out.push({id:c.id,title:`Country: ${c.name}`,date:c.target,kind:'deadline',src:'country'})});
  return out.sort((a,b)=>a.date.localeCompare(b.date))}
const upcoming=()=>allReminders().filter(r=>r.date>=today());
function eventsOn(d){return allReminders().filter(r=>r.date===d)}

let toastTimer=null,undoSnap=null;

function showToast(msg,snap,action){undoSnap=snap||null;const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${snap?'<button class="btn sm" data-act="undo">Undo</button>':''}${action?`<button class="btn sm" data-act="${action.act}" data-id="${action.id}">${esc(action.label)}</button>`:''}`;t.hidden=false;translateDOM(t);clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,action?30000:9000)}
function undoLast(){if(!undoSnap)return;S=migrate(JSON.parse(undoSnap));hideToast();save();render()}

/* ---------- small html builders ---------- */
const cap=(p,c,cls='')=>`<div class="cap ${cls}" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${clamp(p,0,100)}%;${c?`--c:${c}`:''}"></i></div>`;
const pc=p=>`${Math.round(p)}%`;
const areaOpts=(sel,none)=>(none?`<option value="">No area</option>`:'')+S.areas.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
const head=(title,sub,acts='')=>`<header class="page-h"><div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="acts">${acts}</div></header>`;
const PRIO={'':'none',low:'low',med:'medium',high:'high'};
const PRIO_NEXT={'':'low',low:'med',med:'high',high:''};
function linkInfo(t){const g=t.goalId?S.goals.find(x=>x.id===t.goalId):null;return{g,mode:g?(g.type==='level'?'ask':(t.linkMode||'one')):''}}
function linkApply(o,done,val){
  const g=o.goalId?S.goals.find(x=>x.id===o.goalId):null;if(!g)return;
  const mode=g.type==='level'?'ask':(o.linkMode||'one');const date=o.date&&o.date<=today()?o.date:today();
  if(g.type==='level'){
    if(done){if(val!=null){const e={id:uid(),date,at:Date.now(),value:val};(g.log=g.log||[]).push(e);o.logId=e.id;levelSync(g)}}
    else if(o.logId){g.log=(g.log||[]).filter(e=>e.id!==o.logId);o.logId=null;levelSync(g)}
    return}
  if(g.type!=='count')return;
  if(done){const amt=mode==='ask'?val:(o.amount||1);if(amt!=null&&amt!==0){o.entryId=goalAdd(g,amt,date);o.added=amt}}
  else{const amt=o.added!=null?o.added:(o.amount||1);if(amt)goalRemove(g,amt,o.entryId);o.added=0;o.entryId=null}}
const applyLink=(t,done,val)=>linkApply(t,done,val);
function setTaskDone(t,done,val){if(t.done===done)return;applyLink(t,done,val);t.done=done;t.doneAt=done?today():null}
let askPending=false;
function tickTask(t,done){const {g,mode}=linkInfo(t);if(done&&!t.done&&g&&mode==='ask'){askValue(t.title,g,v=>{setTaskDone(t,true,v);commit()});return}setTaskDone(t,done);commit()}
function askValue(title,g,cb){
  const dlg=$('#dlg');const l=g.type==='level'?levelLog(g):[];const last=l[l.length-1];askPending=true;
  dlg.innerHTML=`<form id="dform"><h3>${esc(title)}</h3><div class="fr"><label>${g.type==='level'?'New value':'Amount to add'} (${esc(g.unit||'')})</label><input type="number" name="v" step="any" inputmode="decimal" autocomplete="off" ${g.type==='count'?'min="0"':''} required></div>${last?`<p class="muted sm">Last value: ${fmtN(last.value)} ${esc(g.unit||'')}</p>`:''}<p class="muted sm">Goal: ${esc(g.title)}</p><div class="dact"><button type="button" class="btn ghost" data-ask="skip">Done without a number</button><button type="button" class="btn ghost" data-act="close-dlg">Cancel</button><button class="btn primary">Save</button></div></form>`;
  const form=$('#dform');translateDOM(dlg);
  form.addEventListener('submit',e=>{e.preventDefault();const v=parseFloat(form.elements.v.value);if(isNaN(v))return;askPending=false;dlg.close();cb(v)});
  form.querySelector('[data-ask=skip]').addEventListener('click',()=>{askPending=false;dlg.close();cb(null)});
  dlg.showModal();form.elements.v.focus()}
function linkChip(t,g){
  if(!g)return'';const {mode}=linkInfo(t);
  if(g.type==='level'){if(t.done&&t.logId){const e=(g.log||[]).find(x=>x.id===t.logId);if(e)return`${fmtN(e.value)} ${esc(g.unit)} logged to ${esc(g.title)}`}return t.done?'':`${esc(g.title)}: will ask for ${esc(g.unit)}`}
  if(mode==='ask')return t.done?(t.added?`+${fmtN(t.added)} ${esc(g.unit)} to ${esc(g.title)}`:''):`${esc(g.title)}: will ask for ${esc(g.unit)}`;
  return`+${fmtN(t.amount||1)} ${esc(g.unit)} to ${esc(g.title)}`}
function moveTask(id,date,targetId,after){
  const i=S.tasks.findIndex(t=>t.id===id);if(i<0)return;const t=S.tasks[i];S.tasks.splice(i,1);t.date=date;
  const j=targetId&&targetId!==id?S.tasks.findIndex(x=>x.id===targetId):-1;
  if(j<0)S.tasks.push(t);else S.tasks.splice(after?j+1:j,0,t)}
function taskDetail(t){

    <div class="chk">${subs.map(x=>`<label class="task ${x.done?'done':''}"><input type="checkbox" data-chg="toggle-sub" data-id="${t.id}" data-item="${x.id}" ${x.done?'checked':''}><span class="t">${esc(x.text)}</span><button type="button" class="x" data-act="del-sub" data-id="${t.id}" data-item="${x.id}" aria-label="Delete step">×</button></label>`).join('')}</div>
    <form class="addrow" data-form="add-sub" data-id="${t.id}" style="margin:0"><input type="text" name="text" placeholder="Add a step" autocomplete="off" required><button class="btn sm">Add</button></form></div>`}
function taskRow(t){
  const g=t.goalId?S.goals.find(x=>x.id===t.goalId):null;const fm=S.sessions.filter(x=>x.taskId===t.id).reduce((a,x)=>a+x.minutes,0);const subs=t.subs||[];const sd=subs.filter(x=>x.done).length;const open=ui.openTask===t.id;
  return`<div class="trow ${open?'open':''}" data-task="${t.id}" draggable="${open?'false':'true'}"><label class="task ${t.done?'done':''}"><button type="button" class="pri p-${t.prio||'none'}" data-act="cycle-prio" data-id="${t.id}" title="Priority: ${PRIO[t.prio||'']}" aria-label="Priority: ${PRIO[t.prio||'']}"></button><input type="checkbox" data-chg="toggle-task" data-id="${t.id}" ${t.done?'checked':''}><span class="dot" style="background:${areaColor(t.areaId)}"></span><span class="t">${esc(t.title)}${linkChip(t,g)?`<span class="lk">${linkChip(t,g)}</span>`:''}${subs.length?`<span class="lk mu">${sd}/${subs.length} steps</span>`:''}${fm?`<span class="lk mu">${hm(fm)} focused</span>`:''}</span>${t.ruleId?'<span class="rp" title="Recurring">↻</span>':''}<button type="button" class="subbtn" data-act="task-open" data-id="${t.id}" aria-expanded="${open}" title="Task details" aria-label="Task details"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="x" data-act="del-task" data-id="${t.id}" aria-label="Delete task">×</button></label>${open?taskDetail(t):''}</div>`}
const linkOptions=sel=>S.goals.filter(g=>g.type==='count'||g.type==='level').map(g=>g.type==='level'?`<option value="${g.id}|ask" ${sel===g.id+'|ask'?'selected':''}>${esc(g.title)} · ask each time</option>`:`<option value="${g.id}|one" ${sel===g.id+'|one'?'selected':''}>${esc(g.title)} · fixed amount</option><option value="${g.id}|ask" ${sel===g.id+'|ask'?'selected':''}>${esc(g.title)} · ask each time</option>`).join('');
const addTask=(date,full)=>{const cg=S.goals.filter(g=>g.type==='count'||g.type==='level');return`<form class="addrow wrap" data-form="add-task" data-date="${date}"><input type="text" name="title" placeholder="Add a task" autocomplete="off" required><select class="mini" name="areaId" aria-label="Area">${areaOpts('',true)}</select><button class="btn sm">Add</button>${full?`<div class="linkrow"><span class="muted sm">Priority</span><select class="mini" name="prio" aria-label="Priority"><option value="">None</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select>${cg.length?`<span class="muted sm">Link to goal</span><select class="mini" name="link" aria-label="Linked goal"><option value="">No goal</option>${linkOptions('')}</select><span class="muted sm">amount</span><input class="numi" type="number" name="amount" value="1" min="0" step="any" title="Used only for fixed amount">`:''}</div>`:''}</form>`};

/* ---------- charts ---------- */
function lineChart(){
  const keys=Object.keys(S.history).sort().slice(-60);
  if(keys.length<2)return`<div class="empty">Your trend line appears after two days of use. Today's snapshot is already saved.</div>`;
  const W=600,H=210,pl=30,pr=8,pt=8,pb=22;
  const x=i=>pl+(W-pl-pr)*(i/(keys.length-1));
  const y=v=>pt+(H-pt-pb)*(1-v/100);
  let g='';
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`});
  const line=(id,color,w)=>{const pts=keys.map((k,i)=>{const v=S.history[k][id];return v==null?null:[x(i),y(v)]}).filter(Boolean);if(pts.length<2)return'';return`<polyline fill="none" style="stroke:${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`};
  const lines=S.areas.map(a=>line(a.id,a.color,1.5)).join('')+line('all','var(--accent)',3);
  const leg=`<span><i class="dot" style="background:var(--accent)"></i>Overall</span>`+S.areas.map(a=>`<span><i class="dot" style="background:${a.color}"></i>${esc(a.name)}</span>`).join('');
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress over time">${g}${lines}<text x="${pl}" y="${H-5}">${fmt(keys[0],{day:'numeric',month:'short'})}</text><text x="${W-pr}" y="${H-5}" text-anchor="end">${fmt(keys[keys.length-1],{day:'numeric',month:'short'})}</text></svg><div class="legend">${leg}</div></div>`}
function barChart(custom){
  const days=[];for(let i=13;i>=0;i--)days.push(addD(today(),-i));
  const cnt=custom||days.map(d=>S.tasks.filter(t=>t.done&&t.doneAt===d).length);
  if(!cnt.some(Boolean))return`<div class="empty">Nothing recorded in the last 14 days yet.</div>`;
  const max=Math.max(3,...cnt);const W=600,H=210,pl=24,pb=22,pt=14;const bw=(W-pl)/days.length;
  let s='';
  cnt.forEach((c,i)=>{const h=(H-pt-pb)*(c/max);const x=pl+i*bw+bw*.18;s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${Math.max(h,c?2:0)}" rx="4" style="fill:${days[i]===today()?'var(--accent)':'var(--info)'}" opacity="${c?1:.15}"/>${c?`<text x="${x+bw*.32}" y="${H-pb-h-4}" text-anchor="middle">${c}</text>`:''}`;if(i%2===0||i===13)s+=`<text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${+days[i].slice(8)}</text>`});
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed in the last 14 days">${s}</svg></div>`}
function donut(p){const r=70,c=2*Math.PI*r;return`<div class="donut"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${r}" fill="none" style="stroke:var(--surface2)" stroke-width="16"/><circle cx="85" cy="85" r="${r}" fill="none" style="stroke:var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><div class="c"><b>${p.toFixed(1)}%</b><span>overall</span></div></div>`}

function levelSpark(g,col){
  const l=levelLog(g);if(l.length<2)return'';const vals=l.map(e=>e.value);const st=g.start||0;
  const lo=Math.min(...vals,g.target,st),hi=Math.max(...vals,g.target,st);const W=240,H=56,pad=4;
  const x=i=>pad+i*(W-2*pad)/(l.length-1),y=v=>hi===lo?H/2:H-pad-(v-lo)/(hi-lo)*(H-2*pad);
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Value over time"><line x1="0" x2="${W}" y1="${y(g.target).toFixed(1)}" y2="${y(g.target).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline points="${l.map((e,i)=>x(i).toFixed(1)+','+y(e.value).toFixed(1)).join(' ')}" fill="none" stroke="${col||'var(--text)'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

/* ===== recurring tasks ===== */
function ruleMatches(r,d){
  const n=diffD(r.start,d);if(n<0)return false;const k=r.interval||1;
  if(r.freq==='daily')return n%k===0;
  if(r.freq==='weekly'){const w=Math.floor(diffD(startOfWeek(r.start),d)/7);return w%k===0&&r.days.includes(P(d).getDay())}
  const a=toCal(r.start),c=toCal(d);
  if(r.freq==='monthly'){const md=(c.y-a.y)*12+(c.m-a.m);return md%k===0&&c.d===Math.min(a.d,monthLen(c.y,c.m))}
  const yd=c.y-a.y;return yd%k===0&&c.m===a.m&&c.d===Math.min(a.d,monthLen(c.y,c.m))}
function ensureRecurring(upTo){
  const base=addD(today(),60);const h=upTo&&upTo>base?upTo:base;let ch=false;
  S.rules.forEach(r=>{const end=r.until&&r.until<h?r.until:h;if(r.genUntil&&r.genUntil>=end)return;
    let d=r.genUntil?addD(r.genUntil,1):r.start;if(d<r.start)d=r.start;
    for(;d<=end;d=addD(d,1)){if(ruleMatches(r,d)&&!S.tasks.some(t=>t.ruleId===r.id&&t.date===d)){S.tasks.push({id:uid(),title:r.title,date:d,areaId:r.areaId||'',done:false,doneAt:null,goalId:r.goalId||'',linkMode:r.goalId?(r.linkMode||'one'):'',amount:r.goalId&&(r.linkMode||'one')==='one'?(r.amount||1):0,ruleId:r.id});ch=true}}
    r.genUntil=end;ch=true});
  return ch}
function viewHorizon(){if(view==='month')return mEnd(ui.month.y,ui.month.m);if(view==='week')return addD(startOfWeek(ui.wk),6);if(view==='today')return ui.date;if(view==='year')return mEnd(ui.year,12);return''}
function ruleText(r){const n=r.interval||1;
  if(r.freq==='daily')return n===1?'Every day':`Every ${n} days`;
  if(r.freq==='weekly')return(n===1?'Every week':`Every ${n} weeks`)+' on '+[...r.days].sort((a,b)=>((a-S.settings.weekStart+7)%7)-((b-S.settings.weekStart+7)%7)).map(d=>dayShort(d)).join(', ');

const sched=(h,d)=>h.days.includes(P(d).getDay());

function weekStreak(h){let w=startOfWeek(today());let n=weekCount(h,w)>=perWeek(h)?1:0;w=addD(w,-7);for(let i=0;i<400;i++){if(weekCount(h,w)>=perWeek(h)){n++;w=addD(w,-7)}else break}return n}
function bestWeekStreak(h){const ks=Object.keys(h.log).filter(k=>h.log[k]).sort();if(!ks.length)return 0;const end=startOfWeek(today());let best=0,run=0;for(let w=startOfWeek(ks[0]);w<=end;w=addD(w,7)){if(weekCount(h,w)>=perWeek(h)){run++;best=Math.max(best,run)}else if(w<end)run=0}return best}

function bestStreak(h){if(hMode(h)==='weekly')return bestWeekStreak(h);const ks=Object.keys(h.log).filter(k=>h.log[k]).sort();if(!ks.length)return 0;let best=0,run=0;for(let d=ks[0];d<=today();d=addD(d,1)){if(!sched(h,d))continue;if(h.log[d]){run++;best=Math.max(best,run)}else run=0}return best}
function habitRate(h,n=30){if(hMode(h)==='weekly'){let c=0;for(let i=0;i<n;i++)if(h.log[addD(today(),-i)])c++;return clamp(c/(perWeek(h)*n/7)*100,0,100)}let sc=0,dn=0;for(let i=0;i<n;i++){const d=addD(today(),-i);if(sched(h,d)){sc++;if(h.log[d])dn++}}return sc?dn/sc*100:0}

  const o={goalId:h.goalId,linkMode:h.linkMode,amount:h.amount,date:d,added:(h.added||{})[d],logId:(h.logIds||{})[d],entryId:(h.entryIds||{})[d]};
  linkApply(o,done,val);h.added=h.added||{};h.logIds=h.logIds||{};h.entryIds=h.entryIds||{};

  const ch=g?linkChip({done:!!h.log[d],added:(h.added||{})[d],logId:(h.logIds||{})[d],amount:h.amount,linkMode:h.linkMode,goalId:h.goalId},g):'';

const toMin=t=>{const p=String(t||'0:0').split(':').map(Number);return(p[0]||0)*60+(p[1]||0)};
const fmtT=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tlDur=e=>{const d=toMin(e.end)-toMin(e.start);return d>0?d:d+1440};
function tlSegs(e,date){const a=toMin(e.start),b=toMin(e.end);if(b>a)return e.date===date?[[a,b]]:[];const o=[];if(e.date===date)o.push([a,1440]);if(addD(e.date,1)===date)o.push([0,b]);return o}
const tlMins=(e,d)=>tlSegs(e,d).reduce((x,s)=>x+(s[1]-s[0]),0);
function tlEntries(d){return S.timelog.filter(e=>tlSegs(e,d).length).sort((a,b)=>tlSegs(a,d)[0][0]-tlSegs(b,d)[0][0])}
function sessSegs(x,d){const d0=P(d).getTime(),d1=d0+864e5,en=x.at,st=x.at-x.minutes*60000;const a=Math.max(st,d0),b=Math.min(en,d1);return b>a?[[Math.round((a-d0)/60000),Math.round((b-d0)/60000)]]:[]}

function finStats(a,b){const tx=S.txs.filter(x=>x.date>=a&&x.date<=b);const inc=sumBy(tx.filter(x=>x.type==='income'),x=>x.amount),exp=sumBy(tx.filter(x=>x.type==='expense'),x=>x.amount);return{tx,inc,exp,net:inc-exp,rate:inc>0?(inc-exp)/inc*100:0}}

function curveChart(vals){

const JSON_TYPE={description:'LifeLedger data',accept:{'application/json':['.json']}};
const sync={handle:null,state:'off',name:'',lastWrite:0,mod:0,pending:null,msg:'',timer:null};
const idb={open(){return new Promise((res,rej)=>{const r=indexedDB.open('lifeledger',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv','readwrite').objectStore('kv').put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv','readwrite').objectStore('kv').delete(k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}};
async function syncInit(){
  if(!window.showSaveFilePicker){sync.state='unsupported';return}
  try{const h=await idb.get('syncHandle');if(!h)return;sync.handle=h;sync.name=h.name;
    const p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted'){sync.state='needs-permission';render();return}
    sync.state='ok';await syncPull(true);render()}catch(e){sync.state='off'}}
async function syncConnect(existing){
  try{let h;
    if(existing)[h]=await window.showOpenFilePicker({types:[JSON_TYPE],multiple:false});
    else h=await window.showSaveFilePicker({suggestedName:'lifeledger-data.json',types:[JSON_TYPE]});
    if(await h.requestPermission({mode:'readwrite'})!=='granted')return;
    sync.handle=h;sync.name=h.name;sync.state='ok';sync.pending=null;try{await idb.set('syncHandle',h)}catch(e){}
    if(existing){const f=await h.getFile();const txt=await f.text();
      if(txt.trim()){try{const o=JSON.parse(txt);if(Array.isArray(o.areas)&&confirmT('This file already has LifeLedger data. Load it and replace what is in this browser? Choose Cancel to overwrite the file with your current data.')){S=migrate(o);sync.mod=f.lastModified;persistLocal();render();return}}catch(e){}}}
    await syncWrite();render()
  }catch(e){if(e&&e.name!=='AbortError'){sync.state='error';sync.msg=e.message}render()}}
async function syncWrite(){
  if(!sync.handle||sync.state!=='ok'||sync.pending)return;
  try{const w=await sync.handle.createWritable();await w.write(fileJSON());await w.close();const f=await sync.handle.getFile();sync.mod=f.lastModified;sync.lastWrite=Date.now();sync.msg='';if(view==='settings')render()}
  catch(e){sync.state='error';sync.msg=e.message;render()}}
function syncSchedule(){if(sync.state!=='ok'||sync.pending)return;clearTimeout(sync.timer);sync.timer=setTimeout(syncWrite,900)}
async function syncPull(initial){
  if(!sync.handle||sync.state!=='ok')return;
  try{const f=await sync.handle.getFile();if(!initial&&f.lastModified<=sync.mod)return;const o=JSON.parse(await f.text());sync.mod=f.lastModified;
    if(Array.isArray(o.areas)&&((o.meta&&o.meta.savedAt)||0)>((S.meta&&S.meta.savedAt)||0)+1000){sync.pending=o;render()}
    else if(initial)syncSchedule()}catch(e){}}
async function syncReconnect(){try{if(await sync.handle.requestPermission({mode:'readwrite'})==='granted'){sync.state='ok';await syncPull(true);render()}}catch(e){sync.msg=e.message;render()}}
async function syncDisconnect(){try{await idb.del('syncHandle')}catch(e){}sync.handle=null;sync.state=window.showSaveFilePicker?'off':'unsupported';sync.pending=null;render()}
function syncPanel(){
  const lab=sync.state==='ok'?'On':sync.state==='needs-permission'?'Paused':sync.state==='error'?'Error':'Off';
  let body;
  if(sync.state==='unsupported')body=`<p class="muted sm">Automatic file sync needs desktop Chrome or Edge. In other browsers, use Export and Import instead.</p>`;
  else if(!sync.handle)body=`<p class="muted sm" style="margin-bottom:12px">Keep your data in a real file. If that file lives in a Google Drive, OneDrive, or iCloud folder, it follows you between computers. Changes are saved to it automatically.</p><div class="acts"><button class="btn primary" data-act="sync-create">Create sync file</button><button class="btn" data-act="sync-open">Use existing file</button></div>${sync.msg?`<p class="dn sm" style="margin-top:8px">${esc(sync.msg)}</p>`:''}`;
  else body=`<p style="margin-bottom:6px"><b>${esc(sync.name)}</b></p><p class="muted sm" style="margin-bottom:12px">${sync.state==='ok'?(sync.lastWrite?`Saved automatically. Last write at ${new Date(sync.lastWrite).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}.`:'Connected. Changes are saved automatically.'):sync.state==='needs-permission'?'Paused until you allow access again.':esc(sync.msg||'Something went wrong.')}</p><div class="acts">${sync.state==='needs-permission'?`<button class="btn primary" data-act="sync-reconnect">Reconnect</button>`:`<button class="btn" data-act="sync-now">Sync now</button>`}<button class="btn danger" data-act="sync-off">Disconnect</button></div>`;
  return`<div class="panel"><div class="panel-h"><h2>Desktop file sync (optional)</h2><span class="chip ${sync.state==='ok'?'on':''}">${lab}</span></div>${body}</div>`}
function globalBanners(){
  let h='';
  if(sync.pending)h+=`<div class="banner"><span>Newer data was found in your sync (cloud or file) than in this browser.</span><span class="acts"><button class="btn sm primary" data-act="sync-load">Load it</button><button class="btn sm" data-act="sync-keep">Keep mine</button></span></div>`;
  if(sync.state==='needs-permission')h+=`<div class="banner"><span>File sync is paused until you allow access again.</span><span class="acts"><button class="btn sm primary" data-act="sync-reconnect">Reconnect</button></span></div>`;

/* ---------- cloud sync (GitHub gist, optional end-to-end encryption) ---------- */
const CLOUD_KEY='lifeledger.cloud';
const GH=()=>{try{return localStorage.getItem('lifeledger.ghApi')||'https://api.github.com'}catch(e){return'https://api.github.com'}};
const cloud={cfg:null,state:'off',msg:'',lastPush:0,lastPull:0,timer:null};
const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function aesKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function packText(){const plain=fileJSON();const pass=cloud.cfg&&cloud.cfg.pass;if(!pass)return plain;
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(pass,salt),new TextEncoder().encode(plain)));
  return JSON.stringify({lifeledger:1,enc:'aes-gcm-pbkdf2',salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function unpackText(text){const o=JSON.parse(text);if(!o.enc)return o;const pass=cloud.cfg&&cloud.cfg.pass;
  if(!pass)throw new Error('This cloud data is encrypted. Enter the passphrase you used on your other device.');
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await aesKey(pass,unb64(o.salt)),unb64(o.data));return JSON.parse(new TextDecoder().decode(pt))}
  catch(e){throw new Error('Wrong passphrase, or the cloud data is damaged.')}}
async function gh(path,opt){
  const r=await fetch(GH()+path,Object.assign({},opt,{cache:'no-store',headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+cloud.cfg.token,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(r.status===401?'GitHub rejected the token (401). Create a new one with the gist scope.':r.status===403?'GitHub refused the request (403). '+(m||''):r.status===404?'Gist not found (404). Make sure the token has the gist scope.':(m||'HTTP '+r.status))}
  return r.json()}
async function cloudRead(){const g=await gh('/gists/'+cloud.cfg.gistId);const f=g.files&&g.files['lifeledger.json'];if(!f)return null;let text=f.content;if(f.truncated&&f.raw_url)text=await (await fetch(f.raw_url,{cache:'no-store'})).text();if(!text||!text.trim())return null;return unpackText(text)}
const saveCloudCfg=()=>{try{localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud.cfg))}catch(e){}};
async function cloudPush(){
  if(!cloud.cfg||cloud.state==='off'||sync.pending)return;
  try{const content=await packText();await gh('/gists/'+cloud.cfg.gistId,{method:'PATCH',body:JSON.stringify({files:{'lifeledger.json':{content}}})});cloud.lastPush=Date.now();cloud.state='ok';cloud.msg='';if(view==='settings')render()}
  catch(e){cloud.state='error';cloud.msg=e.message;render()}}
function cloudSchedule(){if(!cloud.cfg||cloud.state==='off'||sync.pending)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1500)}
async function cloudPull(initial){
  if(!cloud.cfg||cloud.state==='off')return;
  try{const o=await cloudRead();cloud.lastPull=Date.now();const was=cloud.state;cloud.state='ok';cloud.msg='';
    if(o&&Array.isArray(o.areas)){const ra=(o.meta&&o.meta.savedAt)||0,la=(S.meta&&S.meta.savedAt)||0;
      if(ra>la+1000){sync.pending=o}else if(initial&&la>ra+1000)cloudSchedule()}
    if(sync.pending||was==='error'||view==='settings')render()}
  catch(e){cloud.state='error';cloud.msg=/Failed to fetch|NetworkError/i.test(e.message)?'Cannot reach GitHub right now (offline or blocked). It will retry automatically.':e.message;render()}}
function cloudInit(){try{const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null');if(c&&c.token&&c.gistId){cloud.cfg=c;cloud.state='ok';cloudPull(true)}}catch(e){}}
async function cloudConnect(token,pass){
  token=(token||'').trim();if(!token){alertT('Paste your GitHub token first.');return}
  cloud.cfg={token,pass:pass||'',gistId:''};cloud.state='ok';cloud.msg='';render();
  try{let found=null;
    for(let p=1;p<=3&&!found;p++){const list=await gh(`/gists?per_page=100&page=${p}`);found=list.find(g=>g.description==='LifeLedger sync'&&g.files&&g.files['lifeledger.json']);if(list.length<100)break}
    if(found){cloud.cfg.gistId=found.id;const o=await cloudRead();
      if(o&&Array.isArray(o.areas)&&confirmT("Found your LifeLedger data in the cloud. Load it and replace the data in this browser? Choose Cancel to overwrite the cloud copy with this browser's data.")){S=migrate(o);persistLocal();saveCloudCfg();render();return}
      saveCloudCfg();await cloudPush();render();return}
    const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'LifeLedger sync',public:false,files:{'lifeledger.json':{content:await packText()}}})});
    cloud.cfg.gistId=g.id;cloud.lastPush=Date.now();saveCloudCfg();render()
  }catch(e){cloud.cfg=null;cloud.state='off';cloud.msg=e.message;render()}}
function cloudOff(){try{localStorage.removeItem(CLOUD_KEY)}catch(e){}cloud.cfg=null;cloud.state='off';cloud.msg='';render()}

  else if(zone&&row&&row.dataset.task===dragId)zone.classList.add('drop-over')});
document.addEventListener('drop',e=>{
  if(!dragId||!e.target.closest)return;const id=dragId;const row=e.target.closest('[data-task]');const zone=e.target.closest('[data-drop-date]');
  e.preventDefault();dragId=null;clearDnD(true);
  const moving=S.tasks.find(t=>t.id===id);if(!moving)return;
  if(row&&row.dataset.task!==id){const tgt=S.tasks.find(t=>t.id===row.dataset.task);if(!tgt)return;const r=row.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;del('Task moved',()=>moveTask(id,tgt.date,tgt.id,after))}
  else if(zone&&zone.dataset.dropDate){const d=zone.dataset.dropDate;if(d===moving.date&&!row){const last=[...S.tasks].reverse().find(t=>t.date===d);if(last&&last.id===id)return}del('Task moved',()=>moveTask(id,d,null,false))}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});

/* ---------- boot ---------- */
function checkNotify(){
  if(!S.settings.notify||!window.Notification||Notification.permission!=='granted')return;
  let ch=false;
  upcoming().forEach(r=>{const n=diffD(today(),r.date);if([0,1,3,7].includes(n)){const k=`${r.id}:${r.date}:${n}`;if(!S.notified[k]){S.notified[k]=1;ch=true;notify(r.title,n===0?'Today':`${until(r.date)} (${fmt(r.date)})`)}}});
  const sk=`sum:${today()}`;
  if(!S.notified[sk]){const o=S.tasks.filter(t=>t.date===today()&&!t.done).length,hp=S.habits.filter(h=>isDue(h,today())&&!h.log[today()]).length;if(o||hp){S.notified[sk]=1;ch=true;notify('Today in LifeLedger',`${o} task${o===1?'':'s'} and ${hp} habit${hp===1?'':'s'} to do.`)}}
  const ks=Object.keys(S.notified);if(ks.length>400){ks.slice(0,200).forEach(k=>delete S.notified[k]);ch=true}
  if(ch)persistLocal()}
S=load();
resetCalUI();
if(S.timer&&S.timer.end<=Date.now())finishTimer();
ensureRecurring();snapshot();persistLocal();render();checkNotify();syncInit();cloudInit();
setInterval(()=>{if(today()!==lastToday){lastToday=today();ui.date=today();ui.wk=today();save();render()}else updateClock();checkNotify()},30000);
setInterval(tickTimer,1000);
setInterval(()=>cloudPull(false),60000);
window.addEventListener('online',()=>cloudPull(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(cloud.timer){clearTimeout(cloud.timer);cloud.timer=null;cloudPush()}}else cloudPull(false)});
setInterval(()=>{if(sync.state==='ok')syncPull(false)},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.state==='ok')syncPull(false)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&undoSnap&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();undoLast()}});
</script>
